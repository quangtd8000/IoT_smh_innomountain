<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmartHome</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f3f0" />
    <script>
      // Đặt theme trước khi vẽ khung hình đầu tiên, tránh nháy sáng rồi tối.
      // Phải khớp với STORAGE_KEY trong src/context/ThemeContext.tsx
      // Thẻ theme-color ở trên phải đứng TRƯỚC đoạn này thì querySelector mới thấy.
      (function () {
        try {
          var p = localStorage.getItem('smarthome-theme');
          var t =
            p === 'light' || p === 'dark'
              ? p
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#141614' : '#f2f3f0');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
